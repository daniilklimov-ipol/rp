name: Build Desktop EXE (YouTube Watch Predictor)

on:
  push:
    branches: [ "claude/youtube-completion-predictor-8q703b" ]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Run tests
        working-directory: desktop
        run: |
          pip install pytest httpx
          pytest -q

      - name: Build YouTubeWatchPredictor.exe
        working-directory: desktop
        run: pyinstaller --noconfirm ytpredictor.spec

      - name: Show output
        working-directory: desktop
        run: dir dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeWatchPredictor-Windows-exe
          path: desktop/dist/YouTubeWatchPredictor.exe
          if-no-files-found: error

      # When you push a tag like ytp-v1.0.0, also publish the exe as a downloadable Release.
      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/ytp-')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/YouTubeWatchPredictor.exe
