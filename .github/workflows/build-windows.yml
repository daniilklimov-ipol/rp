name: Build Windows EXE

on:
  push:
    branches: [ "claude/browser-implementation-cwzulo" ]
    paths:
      - "browser/**"
      - "main.py"
      - "pybrowser.spec"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5==5.15.11 PyQtWebEngine==5.15.7 pyinstaller==6.11.1

      - name: Build PyBrowser.exe
        run: pyinstaller --noconfirm pybrowser.spec

      - name: Show output
        run: dir dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyBrowser-Windows-exe
          path: dist/PyBrowser.exe
          if-no-files-found: error

      # When you push a tag like v1.0.0, also publish the exe as a downloadable Release.
      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PyBrowser.exe
